<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d22">
  <title data-i18n="gameName">Bookstore Journey</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Fixed 1920x1080 (16:9) stage, scaled to fit the window by js/game.js.
         Its words are by key (data-i18n…, js/i18n.js): locales/locales.json; the language: index.html?lan=hi -->
    <main id="stage" aria-label="Bookstore Journey story" data-i18n-attr="aria-label:ariaStage">
      <div id="scenes"></div>

      <!-- Top-left: scene panel toggle -->
      <button id="btn-panel" class="hud-btn" type="button" aria-label="Open scene list (P)" title="Scenes (P)"
        data-i18n-attr="aria-label:ariaOpenScenes;title:titleOpenScenes"></button>

      <!-- Top-right: back / next -->
      <nav id="nav" aria-label="Scene navigation" data-i18n-attr="aria-label:ariaSceneNav">
        <button id="btn-back" class="nav-btn" type="button" aria-label="Previous scene" data-i18n-attr="aria-label:ariaBack">
          <span class="nav-icon" data-icon="back"></span><span class="nav-label" data-i18n="btnBack">Back</span>
        </button>
        <span id="nav-count" aria-live="polite"></span>
        <button id="btn-next" class="nav-btn nav-btn--primary" type="button" aria-label="Next scene" data-i18n-attr="aria-label:ariaNext">
          <span class="nav-fill"></span>
          <span class="nav-label" data-i18n="btnNext">Next</span><span class="nav-icon" data-icon="next"></span>
        </button>
      </nav>

      <!-- Side panel: jump to any scene -->
      <div id="panel-scrim"></div>
      <aside id="panel" aria-label="Scenes" aria-hidden="true" data-i18n-attr="aria-label:panelScenes">
        <header class="panel-head">
          <h2 data-i18n="panelScenes">Scenes</h2>
          <button id="btn-panel-close" class="panel-close" type="button" aria-label="Close scene list" data-i18n-attr="aria-label:ariaCloseScenes">&times;</button>
        </header>
        <ol id="scene-list"></ol>
        <footer class="panel-foot">
          <label class="switch">
            <input id="autoplay-toggle" type="checkbox" checked>
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-text" data-i18n="autoplayScenes">Auto-play scenes</span>
          </label>
          <p class="keys" data-i18n-html="keysHelp">
            <kbd>&larr;</kbd><kbd>&rarr;</kbd> change scene &middot; <kbd>P</kbd> scenes &middot;
            <kbd>F</kbd> full screen &middot; <kbd>M</kbd> music &middot; <kbd>S</kbd> sound
          </p>
        </footer>
      </aside>

      <div id="loader">
        <div class="loader-title" data-i18n="gameName">Bookstore Journey</div>
        <div class="loader-bar"><span id="loader-fill"></span></div>
        <div id="loader-text" data-i18n="loading">Loading&hellip;</div>
      </div>
    </main>

    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-phone"></div>
      <p data-i18n-html="rotateHint">Turn your device sideways<br>for the best view</p>
    </div>
  </div>

  <!-- The words first (locales/locales.json, in the language ?lan= asks for), then the game, its scripts in this order. -->
  <script src="js/i18n.js"></script>
  <script>
    I18n.load(function () {
      I18n.applyStatic();
      var scripts = ['js/audio.js', 'js/vo_lines.js', 'js/voice.js', 'js/linelog.js', 'js/video_clips.js', 'js/fx.js', 'js/game.js'];
      (function next(i) { // one after another: each runs before the next is added
        if (i >= scripts.length) return;
        var s = document.createElement('script');
        s.src = scripts[i];
        s.onload = s.onerror = function () { next(i + 1); };
        document.body.appendChild(s);
      })(0);
    });
  </script>
</body>
</html>
