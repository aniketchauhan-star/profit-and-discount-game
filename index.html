<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d22">
  <title>Bookstore Journey</title>
  <link rel="icon" type="image/webp" href="assets/ui/start-button.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Fixed 1920x1080 (16:9) stage, scaled to fit the window by js/game.js -->
    <main id="stage" aria-label="Bookstore Journey story">
      <div id="scenes"></div>

      <div id="loader">
        <div class="loader-title">Bookstore Journey</div>
        <div class="loader-bar"><span id="loader-fill"></span></div>
        <div id="loader-text">Loading&hellip;</div>
      </div>
    </main>

    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-phone"></div>
      <p>Turn your device sideways<br>for the best view</p>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/vo_lines.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/video_clips.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
