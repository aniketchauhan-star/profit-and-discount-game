<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d22">
  <title>Bookstore Journey</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Fixed 1920x1080 (16:9) stage, scaled to fit the window by js/game.js -->
    <main id="stage" aria-label="Bookstore Journey story">
      <div id="scenes"></div>

      <!-- Top-left: scene panel toggle -->
      <button id="btn-panel" class="hud-btn" type="button" aria-label="Open scene list (P)" title="Scenes (P)"></button>

      <!-- Top-right: back / next -->
      <nav id="nav" aria-label="Scene navigation">
        <button id="btn-back" class="nav-btn" type="button" aria-label="Previous scene">
          <span class="nav-icon" data-icon="back"></span><span class="nav-label">Back</span>
        </button>
        <span id="nav-count" aria-live="polite">1 / 4</span>
        <button id="btn-next" class="nav-btn nav-btn--primary" type="button" aria-label="Next scene">
          <span class="nav-fill"></span>
          <span class="nav-label">Next</span><span class="nav-icon" data-icon="next"></span>
        </button>
      </nav>

      <!-- Side panel: jump to any scene -->
      <div id="panel-scrim"></div>
      <aside id="panel" aria-label="Scenes" aria-hidden="true">
        <header class="panel-head">
          <h2>Scenes</h2>
          <button id="btn-panel-close" class="panel-close" type="button" aria-label="Close scene list">&times;</button>
        </header>
        <ol id="scene-list"></ol>
        <footer class="panel-foot">
          <label class="switch">
            <input id="autoplay-toggle" type="checkbox" checked>
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-text">Auto-play scenes</span>
          </label>
          <p class="keys">
            <kbd>&larr;</kbd><kbd>&rarr;</kbd> change scene &middot; <kbd>P</kbd> scenes &middot;
            <kbd>F</kbd> full screen &middot; <kbd>M</kbd> music &middot; <kbd>S</kbd> sound
          </p>
        </footer>
      </aside>

      <div id="loader">
        <div class="loader-title">Bookstore Journey</div>
        <div class="loader-bar"><span id="loader-fill"></span></div>
        <div id="loader-text">Loading&hellip;</div>
      </div>
    </main>

    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-phone"></div>
      <p>Turn your device sideways<br>for the best view</p>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
